{{define "ranking.html"}}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking privado</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="private"><section class="panel"><span class="eyebrow">RANKING ÚNICO · {{.Group}}</span><h1>{{.Drag.Name}}</h1><p>Organize as 6 músicas uma única vez. 1 é a mais desejada e 6 a menos desejada. Este mesmo ranking será usado para gerar todas as 6 batalhas.</p><form method="post" action="/ranking/save" id="rankForm"><input type="hidden" name="group" value="{{.Group}}"><input type="hidden" name="drag" value="{{.Drag.ID}}"><input type="hidden" name="order" id="order"><div id="ranking"></div><button>Concluir meu ranking ✓</button></form></section></main><script>const songs={{.Songs}};const saved={{.Drag.Ranking}};let order=saved&&saved.length===6?[...saved]:[...songs];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){document.querySelector('#ranking').innerHTML=order.map((s,i)=>`<div class="rankrow"><b>${i+1}</b><span>${esc(s)}</span><button type="button" ${i===0?'disabled':''} onclick="move(${i},-1)">↑</button><button type="button" ${i===5?'disabled':''} onclick="move(${i},1)">↓</button></div>`).join('');document.querySelector('#order').value=order.join('\x1f')}function move(i,d){[order[i],order[i+d]]=[order[i+d],order[i]];draw()}draw();</script></body></html>{{end}}
